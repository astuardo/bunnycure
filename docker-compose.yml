version: '3.8'

services:
  # ============================================================================
  # Base de Datos PostgreSQL 16 (Entorno Staging / Desarrollo)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bunnycure-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunnycure
      POSTGRES_USER: bunnycure_user
      POSTGRES_PASSWORD: bunnycure_secure_dev_pass
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunnycure_user -d bunnycure"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Backend API Spring Boot (Bunnycure)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunnycure-staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bunnycure
      SPRING_DATASOURCE_USERNAME: bunnycure_user
      SPRING_DATASOURCE_PASSWORD: bunnycure_secure_dev_pass
      APP_TIMEZONE: America/Santiago
      # Llave JWT: se lee de .env (no versionado). Ver .env.example
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (ver .env.example)}
      JWT_ACCESS_EXPIRATION: 28800000
      JWT_REFRESH_EXPIRATION: 604800000
      # Por seguridad en staging, deshabilitar disparos de cobro/alertas reales a WhatsApp
      WHATSAPP_ADMIN_ALERT_ENABLED: "false"
      MAIL_ENABLED: "false"
      APIGATEWAY_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8080"
      CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:*,https://*.vercel.app"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Frontend PWA Nginx (Bunnycure Frontend)
  # ============================================================================
  frontend:
    build:
      context: ../bunnycure-frontend
      dockerfile: Dockerfile
    container_name: bunnycure-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"

volumes:
  postgres_staging_data:
    driver: local
