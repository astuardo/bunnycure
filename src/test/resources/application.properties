spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2

management.health.mail.enabled=false

# Mail configuration for testing
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.smtp.connectiontimeout=5000
spring.mail.smtp.timeout=5000

# Disable mail sending in tests
bunnycure.mail.enabled=false

jwt.secret=test-secret-key-at-least-256-bits-long-for-hmac-sha-tests-1234567890
jwt.expiration=86400000

bunnycure.google.wallet.issuer-id=3388000000023103816
bunnycure.google.wallet.pass-type=loyalty
bunnycure.google.wallet.loyalty-class=bunnycure_loyalty_card
bunnycure.google.wallet.generic-class=bunnycure_generic_card
bunnycure.google.wallet.credentials-path=${GOOGLE_WALLET_CREDENTIALS_PATH:}
bunnycure.google.wallet.hero-base-url=https://bunnycure.cl/assets/wallet
bunnycure.google.wallet.hero-image-extension=svg
bunnycure.google.wallet.hero-version=v1
bunnycure.google.wallet.qr-base-url=
# Graph API local e inalcanzable: ningún test envía mensajes reales a Meta
whatsapp.api.base-url=http://127.0.0.1:9/v22.0
whatsapp.api.token=test-token
whatsapp.api.phoneId=123456789

# Igual que producción (application.properties principal): sin Open-Session-In-View.
# Este archivo reemplaza al principal en los tests, así que hay que repetirlo aquí.
spring.jpa.open-in-view=false
# Varios tests de registro desde la misma IP local
bunnycure.ratelimit.signup.max-per-minute=1000
