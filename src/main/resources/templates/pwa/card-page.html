<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Título y SEO Básico -->
    <title th:text="${cardTitle}">Bunny Pass Club</title>
    <meta name="title" th:content="${cardTitle}" />
    <meta name="description" th:content="${ogDescription}" />
    <meta name="theme-color" th:content="${themeColor}" />
    
    <!-- PWA & Apple Mobile Web App Metadatos -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" th:content="${cardTitle}" />
    <meta name="application-name" th:content="${cardTitle}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" th:href="${appleTouchIcon}" />
    
    <!-- W3C Web Manifest dinámico servido por Spring Boot -->
    <link rel="manifest" th:href="${manifestUrl}" />
    <link rel="canonical" th:href="${canonicalUrl}" />

    <!-- OpenGraph / Facebook Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" th:content="${ogTitle}" />
    <meta property="og:description" th:content="${ogDescription}" />
    <meta property="og:url" th:content="${canonicalUrl}" />
    <meta property="og:image" th:content="${ogImage}" />
    <meta property="og:site_name" th:content="${salonName}" />

    <!-- Twitter Card Metadatos -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" th:content="${ogTitle}" />
    <meta name="twitter:description" th:content="${ogDescription}" />
    <meta name="twitter:image" th:content="${ogImage}" />

    <!-- Persistencia anticipada en localStorage para PWA en móviles -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        try {
            var pubId = /*[[${publicId}]]*/ '';
            if (pubId) {
                localStorage.setItem('bunny_my_loyalty_public_id', pubId);
            }
        } catch (e) {
            console.warn('[PWA] Error accediendo a localStorage', e);
        }
        /*]]>*/
    </script>

    <style>
        :root {
            --brand-primary: [[${themeColor}]];
            --bg-color: #FDFCF8;
            --text-main: #2D3748;
            --text-muted: #718096;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }
        .pass-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        .pass-header {
            background: linear-gradient(135deg, var(--brand-primary), #b26a52);
            color: #ffffff;
            padding: 1.5rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pass-header .salon-info h2 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .pass-header .salon-info p {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .pass-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .pass-body {
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .client-greeting {
            display: flex;
            flex-direction: column;
        }
        .client-greeting .greeting-sub {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .client-greeting .client-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .stamp-slot {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            background: #f7fafc;
            border: 2px dashed #e2e8f0;
            color: #a0aec0;
        }
        .stamp-slot.stamped {
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .reward-banner {
            background: #fffaf0;
            border: 1px solid #feebc8;
            border-radius: 14px;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            color: #7b341e;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .actions-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--brand-primary);
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(212, 139, 112, 0.35);
            transition: opacity 0.2s;
        }
        .btn-primary:active {
            opacity: 0.85;
        }
        .btn-wallet {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .footer-note {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="pass-container">
        <div class="pass-header">
            <div class="salon-info">
                <h2 th:text="${salonName}">BunnyCure</h2>
                <p>Club de Fidelización</p>
            </div>
            <div class="pass-badge">PWA PASS</div>
        </div>

        <div class="pass-body">
            <div class="client-greeting">
                <span class="greeting-sub">Tarjeta Personalizada</span>
                <span class="client-name" th:text="${customerName}">Cliente</span>
            </div>

            <!-- Visualizador de Sellos (Máximo 10) -->
            <div>
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.4rem; color: var(--text-muted);">
                    <span>Sellos Acumulados</span>
                    <strong th:text="${stamps} + ' / ' + ${maxStamps}">0 / 10</strong>
                </div>
                <div class="stamps-grid">
                    <th:block th:each="i : ${#numbers.sequence(1, 10)}">
                        <div th:class="${i <= stamps} ? 'stamp-slot stamped' : 'stamp-slot'">
                            <span th:if="${i <= stamps}">🐰</span>
                            <span th:if="${i > stamps}" th:text="${i}"></span>
                        </div>
                    </th:block>
                </div>
            </div>

            <!-- Banner de Recompensa -->
            <div class="reward-banner">
                <span>🎁</span>
                <div th:text="${rewardStatusMessage}">Acumula visitas para obtener beneficios exclusivos.</div>
            </div>

            <!-- Acciones -->
            <div class="actions-section">
                <a th:href="${frontendSpaUrl}" class="btn-primary">
                    Abrir en BunnyCure App <span>➔</span>
                </a>
                
                <a th:if="${googleWalletUrl != null}" th:href="${googleWalletUrl}" class="btn-wallet" target="_blank" rel="noopener">
                    Guardar en Google Wallet
                </a>
            </div>
        </div>
    </div>

    <div class="footer-note">
        Para anclar a tu pantalla de inicio en iPhone pulsa <strong>Compartir</strong> y <strong>Agregar a pantalla de inicio</strong>.
    </div>

    <!-- Script de redirección automática transparente si se accede directamente desde el navegador interactivo -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            var spaUrl = /*[[${frontendSpaUrl}]]*/ '';
            var isBot = /bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit|whatsapp|twitterbot|telegrambot|slackbot/i.test(navigator.userAgent);
            var urlParams = new URLSearchParams(window.location.search);
            var isSsrPreview = urlParams.get('preview') === 'true' || urlParams.get('ssr') === 'true';

            // Si es un navegador real y no un scraper/bot ni modo preview, redirigir a la SPA conservando la URL
            if (!isBot && !isSsrPreview && spaUrl && window.location.href !== spaUrl) {
                // Pequeño delay para permitir que el motor PWA/A2HS lea el manifest si se dispara inmediatamente
                setTimeout(function() {
                    window.location.replace(spaUrl);
                }, 100);
            }
        })();
        /*]]>*/
    </script>
</body>
</html>
